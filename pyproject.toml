[project]
name = "identityguard"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "boto3>=1.35,<2",
    "clickhouse-connect>=0.8,<2",
    "confluent-kafka>=2.8,<3",
    "cryptography>=46,<50",
    "fastapi>=0.115,<1",
    "google-re2>=1.1,<2",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "polars>=1.30,<2",
    "protobuf>=6.31,<8",
    "pyyaml>=6,<7",
    "temporalio>=1.10,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
 "hypothesis>=6,<7",
 "pytest>=8,<10",
 "ruff>=0.11,<1",
 "mypy>=1.15,<2",
 "boto3-stubs[cloudtrail,iam,sts]>=1.35,<2",
 "types-pyyaml>=6,<7",
 "grpcio-tools>=1.74,<2",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "backend"
files = ["backend/app"]

[tool.ruff.lint]
exclude = ["backend/app/wire/*"]

[tool.ruff.format]
exclude = ["backend/app/wire/*"]
